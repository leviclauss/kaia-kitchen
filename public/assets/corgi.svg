<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none" role="img" aria-label="Cute corgi">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="35" fill="#F4A460"/>
  <ellipse cx="100" cy="135" rx="40" ry="25" fill="#FFF8F0"/>
  <!-- Legs -->
  <rect x="55" y="145" width="16" height="28" rx="8" fill="#F4A460"/>
  <rect x="80" y="148" width="16" height="25" rx="8" fill="#F4A460"/>
  <rect x="104" y="148" width="16" height="25" rx="8" fill="#F4A460"/>
  <rect x="129" y="145" width="16" height="28" rx="8" fill="#F4A460"/>
  <!-- Paws -->
  <ellipse cx="63" cy="172" rx="10" ry="6" fill="#FFF8F0"/>
  <ellipse cx="88" cy="172" rx="10" ry="6" fill="#FFF8F0"/>
  <ellipse cx="112" cy="172" rx="10" ry="6" fill="#FFF8F0"/>
  <ellipse cx="137" cy="172" rx="10" ry="6" fill="#FFF8F0"/>
  <!-- Head -->
  <ellipse cx="100" cy="70" rx="48" ry="42" fill="#F4A460"/>
  <!-- Ears -->
  <path d="M55 55 L40 15 L75 48 Z" fill="#F4A460"/>
  <path d="M55 52 L45 25 L70 48 Z" fill="#FFB6C1"/>
  <path d="M145 55 L160 15 L125 48 Z" fill="#F4A460"/>
  <path d="M145 52 L155 25 L130 48 Z" fill="#FFB6C1"/>
  <!-- White face blaze -->
  <ellipse cx="100" cy="78" rx="28" ry="26" fill="#FFF8F0"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="65" rx="7" ry="8" fill="#3D2914"/>
  <ellipse cx="118" cy="65" rx="7" ry="8" fill="#3D2914"/>
  <circle cx="84" cy="63" r="2.5" fill="#FFF"/>
  <circle cx="120" cy="63" r="2.5" fill="#FFF"/>
  <!-- Nose -->
  <ellipse cx="100" cy="85" rx="8" ry="6" fill="#3D2914"/>
  <ellipse cx="98" cy="83" rx="2" ry="1.5" fill="#FFF" opacity="0.4"/>
  <!-- Smile -->
  <path d="M90 95 Q100 105 110 95" stroke="#3D2914" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="68" cy="80" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="132" cy="80" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
  <!-- Tail stump -->
  <ellipse cx="155" cy="120" rx="12" ry="10" fill="#F4A460"/>
  <ellipse cx="158" cy="118" rx="6" ry="5" fill="#FFF8F0"/>
</svg>
